<!DOCTYPE html>
<html>
<head>

<title>Professional Resume Builder</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

body{
font-family:Arial;
background:#f2f2f2;
margin:0;
}

.container{
display:flex;
}

.form{
width:40%;
background:white;
padding:20px;
height:100vh;
overflow:auto;
}

.preview{
width:60%;
background:#eaeaea;
padding:20px;
}

input,textarea,select{
width:100%;
padding:8px;
margin-top:5px;
margin-bottom:10px;
}

button{
padding:10px;
margin:5px;
background:#007bff;
color:white;
border:none;
cursor:pointer;
}

#resume{
background:white;
padding:30px;
min-height:600px;
}

.template1 h1{
color:#007bff;
}

.template2{
font-family:Georgia;
}

.template2 h1{
color:#222;
border-bottom:2px solid #000;
}

.template3{
background:#fafafa;
}

img{
max-width:120px;
border-radius:5px;
}

</style>
</head>

<body>

<div class="container">

<div class="form">

<h2>Resume Builder</h2>

<label>Template</label>
<select id="template">
<option value="template1">Template 1</option>
<option value="template2">Template 2</option>
<option value="template3">Template 3</option>
<option value="template4">Template 4</option>
<option value="template5">Template 5</option>
<option value="template6">Template 6</option>
<option value="template7">Template 7</option>
<option value="template8">Template 8</option>
<option value="template9">Template 9</option>
<option value="template10">Template 10</option>
</select>

<label>Photo</label>
<input type="file" id="photo">

<label>Name</label>
<input id="name">

<label>Email</label>
<input id="email">

<label>Phone</label>
<input id="phone">

<label>Address</label>
<textarea id="address"></textarea>

<label>Skills</label>
<textarea id="skills"></textarea>

<label>Education</label>
<textarea id="education"></textarea>

<label>Experience</label>
<textarea id="experience"></textarea>

<button onclick="generateResume()">Generate Resume</button>
<button onclick="downloadPDF()">Download PDF</button>
<button onclick="printResume()">Print</button>
<button onclick="resetForm()">Reset</button>

</div>

<div class="preview">

<h2>Preview</h2>

<div id="resume"></div>

</div>

</div>

<script>

let photoData="";

document.getElementById("photo").addEventListener("change",function(){

let file=this.files[0];

let reader=new FileReader();

reader.onload=function(e){
photoData=e.target.result;
}

reader.readAsDataURL(file);

});

function generateResume(){

let name=document.getElementById("name").value;
let email=document.getElementById("email").value;
let phone=document.getElementById("phone").value;
let address=document.getElementById("address").value;
let skills=document.getElementById("skills").value;
let education=document.getElementById("education").value;
let experience=document.getElementById("experience").value;
let template=document.getElementById("template").value;

let html=`

<div class="${template}">

<img src="${photoData}">

<h1>${name}</h1>

<p><b>Email:</b> ${email}</p>
<p><b>Phone:</b> ${phone}</p>
<p><b>Address:</b> ${address}</p>

<h3>Skills</h3>
<p>${skills}</p>

<h3>Education</h3>
<p>${education}</p>

<h3>Experience</h3>
<p>${experience}</p>

</div>

`;

document.getElementById("resume").innerHTML=html;

}

function downloadPDF(){

let element=document.getElementById("resume");

html2pdf().from(element).save("resume.pdf");

}

function printResume(){

let printContents=document.getElementById("resume").innerHTML;

let win=window.open();

win.document.write(printContents);

win.print();

}

function resetForm(){

location.reload();

}

</script>

</body>
</html>
