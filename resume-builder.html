<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Resume Builder | VRTech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; height: 100vh; overflow: hidden; }
        .main-container { display: grid; grid-template-columns: 400px 1fr; height: 100vh; }
        .sidebar { background: white; border-right: 1px solid #e2e8f0; overflow-y: auto; padding: 25px; }
        .preview-area { background: #cbd5e1; padding: 40px; overflow-y: auto; display: flex; justify-content: center; }
        
        /* --- Resume Canvas (A4) --- */
        #resume-canvas { 
            background: white; 
            width: 210mm; 
            min-height: 297mm; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transform-origin: top center;
            display: flex;
            flex-direction: column;
        }

        /* मजकूर पानाच्या बाहेर जाण्यापासून रोखण्यासाठी (Strict Rules) */
        #resume-canvas * {
            overflow-wrap: anywhere !important; 
            word-break: break-word !important;
            white-space: pre-wrap !important;
            max-width: 100%;
        }

        .input-box { width: 100%; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px; font-size: 14px; margin-bottom: 12px; }
        .profile-img { width: 120px; height: 120px; object-fit: cover; border-radius: 8px; border: 3px solid white; }
    </style>
</head>
<body>

    <div class="main-container">
        <aside class="sidebar">
            <h2 class="text-2xl font-bold text-blue-700 mb-4">Resume Details</h2>
            
            <div class="mb-4 p-3 bg-gray-50 rounded-lg border-2 border-dashed border-gray-300">
                <label class="text-xs font-bold uppercase text-gray-500 block mb-2">फोटो अपलोड करा</label>
                <input type="file" id="photoInput" accept="image/*" onchange="previewPhoto(event)" class="text-xs">
            </div>

            <label class="text-xs font-bold uppercase text-gray-500">लेआउट निवडा</label>
            <select id="layoutId" onchange="update()" class="input-box bg-blue-50 font-bold">
                <option value="modern">Modern Professional</option>
                <option value="executive">Executive Classic</option>
                <option value="minimal">Minimalist Clean</option>
                <option value="sidebar">Creative Side-Bar</option>
                <option value="oldschool">Old School Classic</option>
                <option value="carmelo">Carmelo Barese (New Layout)</option>
            </select>

            <label class="text-xs font-bold uppercase text-gray-500">थीम रंग</label>
            <input type="color" id="themeColor" value="#1e40af" oninput="update()" class="w-full h-10 mb-4 cursor-pointer">

            <input type="text" id="inName" placeholder="पूर्ण नाव" oninput="update()" class="input-box">
            <input type="text" id="inJob" placeholder="तुमचे पद (उदा. Software Developer)" oninput="update()" class="input-box">
            <input type="text" id="inPhone" placeholder="मोबाईल" oninput="update()" class="input-box">
            <input type="text" id="inEmail" placeholder="ईमेल" oninput="update()" class="input-box">
            <input type="text" id="inAddress" placeholder="शहर, राज्य" oninput="update()" class="input-box">
            
            <textarea id="inSummary" placeholder="प्रोफेशनल सारांश (Summary)" oninput="update()" rows="3" class="input-box"></textarea>
            <textarea id="inExp" placeholder="अनुभव (प्रत्येक ओळीवर नवीन)" oninput="update()" rows="4" class="input-box"></textarea>
            <textarea id="inEdu" placeholder="शिक्षण" oninput="update()" rows="3" class="input-box"></textarea>
            <input type="text" id="inSkills" placeholder="कौशल्ये (स्वल्पविराम द्या)" oninput="update()" class="input-box">

            <button onclick="downloadPDF()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg shadow-lg hover:bg-black transition mt-4">Download PDF</button>
        </aside>

        <main class="preview-area" id="previewArea">
            <div id="resume-canvas"></div>
        </main>
    </div>

    <script>
        let photoData = "";

        function previewPhoto(event) {
            const reader = new FileReader();
            reader.onload = function() {
                photoData = reader.result;
                update();
            }
            reader.readAsDataURL(event.target.files[0]);
        }

        function update() {
            const val = (id) => document.getElementById(id).value;
            const config = {
                name: val('inName') || "तुमचे नाव",
                job: val('inJob') || "Software Developer",
                email: val('inEmail') || "email@example.com",
                phone: val('inPhone') || "9876543210",
                address: val('inAddress') || "शहर, राज्य",
                summary: val('inSummary') || "तुमची माहिती येथे दिसेल...",
                exp: val('inExp').split('\n').filter(i => i.trim()),
                edu: val('inEdu').split('\n').filter(i => i.trim()),
                skills: val('inSkills').split(',').filter(i => i.trim()),
                color: val('themeColor'),
                layout: val('layoutId')
            };

            const canvas = document.getElementById('resume-canvas');
            let content = "";

            // --- Layout: Carmelo Barese (New) ---
            if (config.layout === 'carmelo') {
                content = `
                    <div style="padding: 60px 50px; flex-grow: 1; display: flex; flex-direction: column; color: #333; font-family: 'Georgia', serif;">
                        <div style="margin-bottom: 40px; border-bottom: 2px solid ${config.color}; padding-bottom: 20px;">
                            <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                                <div style="flex: 1;">
                                    <h1 style="font-size: 50px; font-weight: normal; margin: 0; line-height: 1;">
                                        ${config.name.split(' ')[0]} <span style="color: ${config.color};">${config.name.split(' ').slice(1).join(' ') || ''}</span>
                                    </h1>
                                    <h2 style="font-size: 22px; font-weight: bold; color: #444; margin-top: 10px; text-transform: lowercase;">${config.job}</h2>
                                </div>
                                ${photoData ? `<img src="${photoData}" style="width: 100px; height: 100px; object-fit: cover; border: 1px solid #ddd;">` : ''}
                            </div>
                        </div>
                        <div style="display: grid; grid-template-columns: 220px 1fr; gap: 40px; flex-grow: 1;">
                            <div style="border-right: 1px solid #ddd; padding-right: 20px; text-align: right;">
                                <h3 style="color: ${config.color}; font-weight: bold; text-transform: uppercase; font-size: 14px; letter-spacing: 1px;">Contact</h3>
                                <p style="font-size: 12px; line-height: 1.8; color: #555;">${config.address}<br>${config.phone}<br>${config.email}</p>
                                <h3 style="color: ${config.color}; font-weight: bold; margin-top: 40px; text-transform: uppercase; font-size: 14px; letter-spacing: 1px;">Skills</h3>
                                <div style="font-size: 12px; line-height: 1.8; color: #555;">${config.skills.map(s => `<div>• ${s.trim()}</div>`).join('')}</div>
                            </div>
                            <div>
                                <div style="margin-bottom: 30px;"><p style="font-size: 14px; line-height: 1.8;">${config.summary}</p></div>
                                <h3 style="color: ${config.color}; font-weight: bold; margin-bottom: 15px; text-transform: uppercase; font-size: 14px; letter-spacing: 1px;">Experience</h3>
                                <div style="margin-bottom: 30px;">${config.exp.map(e => `<p style="font-size: 13px; margin-bottom: 12px; line-height: 1.6;">■ ${e}</p>`).join('')}</div>
                                <h3 style="color: ${config.color}; font-weight: bold; margin-bottom: 15px; text-transform: uppercase; font-size: 14px; letter-spacing: 1px;">Education</h3>
                                <div>${config.edu.map(e => `<p style="font-size: 13px; margin-bottom: 10px; line-height: 1.6;">■ ${e}</p>`).join('')}</div>
                            </div>
                        </div>
                    </div>
                `;
            } 
            // --- Layout: Modern ---
            else if (config.layout === 'modern') {
                content = `
                    <div style="padding: 50px; flex-grow: 1;">
                        <div style="border-left: 10px solid ${config.color}; padding-left: 20px; margin-bottom: 30px;">
                            <h1 style="font-size: 40px; font-weight: 800;">${config.name}</h1>
                            <p style="color: ${config.color}; font-weight: 600;">${config.job} | ${config.email}</p>
                        </div>
                        <h3 style="color: ${config.color}; border-bottom: 2px solid #eee; font-weight: 700;">PROFILE</h3>
                        <p style="font-size: 14px; margin-bottom: 20px;">${config.summary}</p>
                        <h3 style="color: ${config.color}; border-bottom: 2px solid #eee; font-weight: 700;">EXPERIENCE</h3>
                        ${config.exp.map(e => `<p style="font-size: 13px;">• ${e}</p>`).join('')}
                    </div>
                `;
            }
            // --- Layout: Sidebar ---
            else if (config.layout === 'sidebar') {
                content = `
                    <div style="display: grid; grid-template-columns: 260px 1fr; min-height: 297mm;">
                        <div style="background: ${config.color}; color: white; padding: 40px 25px;">
                            ${photoData ? `<img src="${photoData}" class="profile-img" style="margin-bottom:20px;">` : ''}
                            <h2 style="font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.3);">CONTACT</h2>
                            <p style="font-size: 12px; margin-bottom: 20px;">${config.phone}<br>${config.email}</p>
                            <h2 style="font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.3);">SKILLS</h2>
                            <div style="font-size: 12px;">${config.skills.join('<br>')}</div>
                        </div>
                        <div style="padding: 50px;">
                            <h1 style="font-size: 42px; font-weight: 800; color: ${config.color};">${config.name}</h1>
                            <p style="font-size: 14px; line-height: 1.6;">${config.summary}</p>
                            <h3 style="color: ${config.color}; border-bottom: 2px solid #eee; margin-top: 20px;">EXPERIENCE</h3>
                            ${config.exp.map(e => `<p style="font-size: 13px;">• ${e}</p>`).join('')}
                        </div>
                    </div>
                `;
            }
            // --- Default / Other Layouts Placeholder ---
            else {
                content = `<div style="padding: 50px; text-align: center;"><h1>${config.name}</h1><p>${config.summary}</p></div>`;
            }

            canvas.innerHTML = content;

            // Auto-scaling for preview
            const area = document.getElementById('previewArea');
            const scale = (area.offsetWidth - 80) / 794; 
            canvas.style.transform = `scale(${scale < 1 ? scale : 1})`;
        }

        function downloadPDF() {
            const element = document.getElementById('resume-canvas');
            const originalTransform = element.style.transform;
            element.style.transform = "scale(1)"; 

            html2pdf().set({
                margin: 0,
                filename: 'Professional_Resume_VRTech.pdf',
                html2canvas: { scale: 3, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            }).from(element).save().then(() => {
                element.style.transform = originalTransform;
            });
        }

        window.onload = update;
    </script>
</body>
</html>
