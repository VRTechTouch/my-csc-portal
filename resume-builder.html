<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <title>Professional Resume Builder | VRTech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; height: 100vh; overflow: hidden; }
        .main-container { display: grid; grid-template-columns: 400px 1fr; height: 100vh; }
        .sidebar { background: white; border-right: 1px solid #e2e8f0; overflow-y: auto; padding: 20px; }
        .preview-area { background: #cbd5e1; padding: 30px; overflow-y: auto; display: flex; justify-content: center; }
        
        /* A4 Page Styling */
        #resume-canvas { 
            background: white; 
            width: 210mm; 
            min-height: 297mm; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transform-origin: top center;
            display: flex;
            flex-direction: column;
        }

        /* मजकूर बाहेर जाऊ नये यासाठी कडक नियम */
        .wrap-text {
            overflow-wrap: anywhere !important; 
            word-break: break-word !important;
            white-space: pre-wrap !important;
        }

        .input-field { width: 100%; border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px; margin-bottom: 10px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="main-container">
        <aside class="sidebar">
            <h2 class="text-xl font-bold text-blue-700 mb-4">Resume Details</h2>
            
            <div class="mb-4">
                <label class="text-xs font-bold text-gray-400">PHOTO</label>
                <input type="file" id="photoInput" accept="image/*" onchange="loadPhoto(event)" class="text-xs w-full">
            </div>

            <input type="text" id="inName" placeholder="पूर्ण नाव" oninput="render()" class="input-field">
            <input type="text" id="inJob" placeholder="तुमची पदवी (Designation)" oninput="render()" class="input-field">
            <input type="text" id="inEmail" placeholder="ईमेल" oninput="render()" class="input-field">
            <input type="text" id="inPhone" placeholder="मोबाईल" oninput="render()" class="input-field">
            
            <textarea id="inSummary" placeholder="सारांश (Summary)" oninput="render()" rows="3" class="input-field"></textarea>
            <textarea id="inExp" placeholder="अनुभव (प्रत्येक ओळीवर एक)" oninput="render()" rows="4" class="input-field"></textarea>
            <textarea id="inEdu" placeholder="शिक्षण (प्रत्येक ओळीवर एक)" oninput="render()" rows="3" class="input-field"></textarea>
            <input type="text" id="inSkills" placeholder="कौशल्ये (स्वल्पविराम द्या)" oninput="render()" class="input-field">

            <div class="mt-4">
                <label class="text-xs font-bold text-gray-400">थीम रंग</label>
                <input type="color" id="themeColor" value="#1e40af" oninput="render()" class="w-full h-8 cursor-pointer">
            </div>

            <button onclick="download()" class="w-full bg-blue-600 text-white font-bold py-3 rounded mt-6 hover:bg-black transition">Download PDF</button>
        </aside>

        <main class="preview-area" id="viewArea">
            <div id="resume-canvas"></div>
        </main>
    </div>

    <script>
        let userPhoto = "";

        function loadPhoto(e) {
            const reader = new FileReader();
            reader.onload = () => { userPhoto = reader.result; render(); };
            reader.readAsDataURL(e.target.files[0]);
        }

        function render() {
            // सर्व ID व्यवस्थित मिळवणे
            const getVal = (id) => document.getElementById(id) ? document.getElementById(id).value : "";
            
            const data = {
                name: getVal('inName') || "तुमचे नाव",
                job: getVal('inJob') || "तुमचे पद",
                email: getVal('inEmail') || "email@example.com",
                phone: getVal('inPhone') || "9000000000",
                summary: getVal('inSummary') || "तुमची माहिती...",
                exp: getVal('inExp').split('\n').filter(x => x.trim()),
                edu: getVal('inEdu').split('\n').filter(x => x.trim()),
                skills: getVal('inSkills').split(',').filter(x => x.trim()),
                color: getVal('themeColor')
            };

            const canvas = document.getElementById('resume-canvas');
            
            // Layout Logic - Padding आणि Layout सुधारले आहे
            canvas.innerHTML = `
                <div style="padding: 50px; flex-grow: 1; display: flex; flex-direction: column;">
                    <div style="display: flex; align-items: center; gap: 30px; border-bottom: 3px solid ${data.color}; padding-bottom: 30px; margin-bottom: 40px;">
                        ${userPhoto ? `<img src="${userPhoto}" style="width: 120px; height: 120px; object-fit: cover; border-radius: 10px; border: 3px solid ${data.color}">` : ''}
                        <div>
                            <h1 class="wrap-text" style="font-size: 40px; font-weight: 800; color: #111; line-height: 1;">${data.name}</h1>
                            <p class="wrap-text" style="font-size: 18px; color: ${data.color}; font-weight: 600; margin-top: 10px;">${data.job}</p>
                            <p style="font-size: 13px; color: #666; margin-top: 5px;">📧 ${data.email} | 📞 ${data.phone}</p>
                        </div>
                    </div>

                    <div style="margin-bottom: 35px;">
                        <h3 style="color: ${data.color}; font-weight: 800; text-transform: uppercase; border-left: 5px solid ${data.color}; padding-left: 15px; margin-bottom: 15px;">Professional Summary</h3>
                        <p class="wrap-text" style="font-size: 14px; line-height: 1.8; color: #333;">${data.summary}</p>
                    </div>

                    <div style="flex-grow: 1; display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 40px;">
                        <div>
                            <h3 style="color: ${data.color}; font-weight: 800; text-transform: uppercase; border-left: 5px solid ${data.color}; padding-left: 15px; margin-bottom: 15px;">Experience</h3>
                            ${data.exp.map(e => `<p class="wrap-text" style="font-size: 14px; margin-bottom: 15px;">• ${e}</p>`).join('')}
                        </div>
                        <div>
                            <h3 style="color: ${data.color}; font-weight: 800; text-transform: uppercase; border-left: 5px solid ${data.color}; padding-left: 15px; margin-bottom: 15px;">Education</h3>
                            ${data.edu.map(e => `<p class="wrap-text" style="font-size: 14px; margin-bottom: 10px;">• ${e}</p>`).join('')}
                            
                            <h3 style="color: ${data.color}; font-weight: 800; text-transform: uppercase; border-left: 5px solid ${data.color}; padding-left: 15px; margin-top: 30px; margin-bottom: 15px;">Skills</h3>
                            <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                                ${data.skills.map(s => `<span style="background: ${data.color}; color: white; padding: 4px 10px; border-radius: 4px; font-size: 11px;">${s}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // Auto-scaling logic
            const area = document.getElementById('viewArea');
            const scale = (area.offsetWidth - 60) / 794; 
            canvas.style.transform = `scale(${scale < 1 ? scale : 1})`;
        }

        async function download() {
            const el = document.getElementById('resume-canvas');
            const oldTransform = el.style.transform;
            el.style.transform = "scale(1)"; 
            
            const opt = {
                margin: 0,
                filename: 'VRTech_Resume.pdf',
                html2canvas: { scale: 3, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            
            await html2pdf().set(opt).from(el).save();
            el.style.transform = oldTransform;
        }

        window.onload = render;
    </script>
</body>
</html>
