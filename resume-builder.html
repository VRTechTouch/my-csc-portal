<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Resume Builder | VRTech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; height: 100vh; overflow: hidden; }
        
        .main-container { display: grid; grid-template-columns: 420px 1fr; height: 100vh; }
        
        /* Sidebar */
        .sidebar { background: white; border-right: 1px solid #e2e8f0; overflow-y: auto; padding: 25px; }
        .form-label { display: block; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 5px; text-transform: uppercase; }
        .input-box { width: 100%; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px; font-size: 14px; margin-bottom: 15px; outline: none; transition: 0.3s; }
        .input-box:focus { border-color: #2563eb; ring: 2px #dbeafe; }

        /* Preview Zone */
        .preview-area { background: #cbd5e1; padding: 40px; overflow-y: auto; display: flex; justify-content: center; align-items: flex-start; }
        
        /* Resume Page Styling - Critical Fixes */
        #resume-canvas { 
            background: white; 
            width: 210mm; 
            min-height: 297mm; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transform-origin: top center;
            /* मजकूर बाहेर जाऊ नये यासाठी महत्त्वाचे */
            word-wrap: break-word;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        #resume-canvas p, #resume-canvas div, #resume-canvas li, #resume-canvas h1 {
            max-width: 100%;
            white-space: normal !important; /* मजकूर आपोआप रॅप होण्यासाठी */
        }

        @media print {
            body { background: none; }
            .sidebar { display: none; }
            #resume-canvas { box-shadow: none; transform: scale(1) !important; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <aside class="sidebar">
            <h2 class="text-2xl font-black text-blue-700 mb-6 italic">VRTech Resume Pro</h2>

            <div class="mb-6 p-4 bg-blue-50 rounded-lg">
                <label class="form-label">लेआउट निवडा (Layout)</label>
                <select id="layoutId" onchange="update()" class="input-box bg-white font-bold text-blue-800">
                    <option value="executive">Executive Classic (Two Column)</option>
                    <option value="modern">Modern Professional (Full Width)</option>
                    <option value="minimal">Minimalist Clean</option>
                    <option value="creative">Creative Sidebar</option>
                </select>

                <label class="form-label">थीम रंग (Theme Color)</label>
                <input type="color" id="themeColor" value="#1e40af" oninput="update()" class="w-full h-10 rounded cursor-pointer border-none p-0">
            </div>

            <label class="form-label">पूर्ण नाव</label>
            <input type="text" id="inName" placeholder="उदा. विशाल पांढरे" oninput="update()" class="input-box">

            <div class="grid grid-cols-2 gap-3">
                <div><label class="form-label">ईमेल</label><input type="email" id="inEmail" oninput="update()" class="input-box"></div>
                <div><label class="form-label">मोबाईल</label><input type="text" id="inPhone" oninput="update()" class="input-box"></div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div><label class="form-label">जन्म तारीख</label><input type="date" id="inDOB" oninput="update()" class="input-box"></div>
                <div><label class="form-label">शहर</label><input type="text" id="inAddress" oninput="update()" class="input-box"></div>
            </div>

            <label class="form-label">प्रोफेशनल सारांश (Summary)</label>
            <textarea id="inSummary" oninput="update()" rows="3" class="input-box" placeholder="तुमच्या कामाबद्दल थोडक्यात सांगा..."></textarea>

            <label class="form-label">अनुभव (Experience)</label>
            <textarea id="inExp" oninput="update()" rows="4" class="input-box" placeholder="उदा. Software Developer at Swiggy (2021-Present)"></textarea>

            <label class="form-label">शिक्षण (Education)</label>
            <textarea id="inEdu" oninput="update()" rows="4" class="input-box" placeholder="उदा. B.Tech in CS (2018-2022)"></textarea>

            <label class="form-label">कौशल्ये (Skills - स्वल्पविराम द्या)</label>
            <input type="text" id="inSkills" placeholder="उदा. Java, Python, HTML" oninput="update()" class="input-box">

            <label class="form-label">छंद / आवडी (Hobbies)</label>
            <input type="text" id="inHobbies" oninput="update()" class="input-box">

            <button onclick="downloadPDF()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-black transition-all transform hover:scale-105 mt-4">
                Download PDF Resume
            </button>
        </aside>

        <main class="preview-area" id="previewArea">
            <div id="resume-canvas">
                </div>
        </main>
    </div>

    <script>
        function update() {
            const data = {
                name: document.getElementById('inName').value || "आपले नाव",
                email: document.getElementById('inEmail').value || "example@mail.com",
                phone: document.getElementById('inPhone').value || "+91 0000000000",
                dob: document.getElementById('inDOB').value,
                city: document.getElementById('inAddress').value || "तुमचे शहर",
                summary: document.getElementById('inSummary').value || "येथे तुमचा सारांश दिसेल...",
                exp: document.getElementById('inExp').value.split('\n').filter(i => i.trim()),
                edu: document.getElementById('inEdu').value.split('\n').filter(i => i.trim()),
                skills: document.getElementById('inSkills').value.split(',').filter(i => i.trim()),
                hobbies: document.getElementById('inHobbies').value || "वाचन, प्रवास",
                color: document.getElementById('themeColor').value,
                layout: document.getElementById('layoutId').value
            };

            const canvas = document.getElementById('resume-canvas');
            let html = "";

            // --- Layout 1: Executive Classic (Two Columns) ---
            if (data.layout === 'executive') {
                html = `
                    <div style="display: grid; grid-template-columns: 280px 1fr; min-height: 297mm; width: 100%;">
                        <div style="background: ${data.color}; color: white; padding: 50px 30px;">
                            <div style="width: 130px; height: 130px; background: rgba(255,255,255,0.2); border-radius: 50%; border: 4px solid white; margin-bottom: 30px;"></div>
                            <h3 style="border-bottom: 2px solid white; padding-bottom: 5px; margin-bottom: 15px; font-weight: bold;">संपर्क</h3>
                            <p style="font-size: 13px; margin-bottom: 10px;">📧 ${data.email}</p>
                            <p style="font-size: 13px; margin-bottom: 10px;">📞 ${data.phone}</p>
                            <p style="font-size: 13px; margin-bottom: 10px;">📍 ${data.city}</p>
                            ${data.dob ? `<p style="font-size: 13px;">📅 ${data.dob}</p>` : ''}

                            <h3 style="border-bottom: 2px solid white; padding-bottom: 5px; margin-top: 40px; margin-bottom: 15px; font-weight: bold;">कौशल्ये</h3>
                            <div style="font-size: 13px; line-height: 1.8;">${data.skills.map(s => `• ${s}`).join('<br>')}</div>
                            
                            <h3 style="border-bottom: 2px solid white; padding-bottom: 5px; margin-top: 40px; margin-bottom: 15px; font-weight: bold;">छंद</h3>
                            <p style="font-size: 13px;">${data.hobbies}</p>
                        </div>
                        <div style="padding: 60px 50px;">
                            <h1 style="font-size: 45px; font-weight: 900; color: ${data.color}; line-height: 1.1; margin-bottom: 10px;">${data.name}</h1>
                            <div style="height: 4px; width: 60px; background: ${data.color}; margin-bottom: 30px;"></div>
                            
                            <h2 style="color: ${data.color}; border-bottom: 1px solid #eee; margin-bottom: 15px; font-weight: 800;">प्रोफेशनल सारांश</h2>
                            <p style="font-size: 14px; color: #444; line-height: 1.6; margin-bottom: 35px;">${data.summary}</p>

                            <h2 style="color: ${data.color}; border-bottom: 1px solid #eee; margin-bottom: 15px; font-weight: 800;">अनुभव</h2>
                            <div style="font-size: 14px; color: #333; line-height: 1.8; margin-bottom: 35px;">
                                ${data.exp.map(e => `<div style="margin-bottom: 12px;">• ${e}</div>`).join('')}
                            </div>

                            <h2 style="color: ${data.color}; border-bottom: 1px solid #eee; margin-bottom: 15px; font-weight: 800;">शिक्षण</h2>
                            <div style="font-size: 14px; color: #333; line-height: 1.8;">
                                ${data.edu.map(e => `<div style="margin-bottom: 12px;">• ${e}</div>`).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }

            // --- Layout 2: Modern Professional (Full Width) ---
            else if (data.layout === 'modern') {
                html = `
                    <div style="padding: 50px; min-height: 297mm; width: 100%;">
                        <div style="text-align: center; border-bottom: 3px solid ${data.color}; padding-bottom: 20px; margin-bottom: 30px;">
                            <h1 style="font-size: 38px; font-weight: 900; color: #111;">${data.name}</h1>
                            <p style="color: ${data.color}; font-weight: 600; font-size: 14px; margin-top: 5px;">
                                ${data.email} | ${data.phone} | ${data.city}
                            </p>
                        </div>

                        <div style="margin-bottom: 30px;">
                            <h3 style="background: ${data.color}; color: white; padding: 5px 15px; display: inline-block; border-radius: 4px; margin-bottom: 15px;">PROFILE</h3>
                            <p style="font-size: 14px; line-height: 1.6; color: #333;">${data.summary}</p>
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px;">
                            <div>
                                <h3 style="color: ${data.color}; border-bottom: 2px solid ${data.color}; margin-bottom: 15px; font-weight: bold;">EXPERIENCE</h3>
                                <div style="font-size: 13px; line-height: 1.7;">${data.exp.map(e => `<p style="margin-bottom: 10px;">• ${e}</p>`).join('')}</div>
                            </div>
                            <div>
                                <h3 style="color: ${data.color}; border-bottom: 2px solid ${data.color}; margin-bottom: 15px; font-weight: bold;">EDUCATION</h3>
                                <div style="font-size: 13px; line-height: 1.7;">${data.edu.map(e => `<p style="margin-bottom: 10px;">• ${e}</p>`).join('')}</div>
                                
                                <h3 style="color: ${data.color}; border-bottom: 2px solid ${data.color}; margin-top: 25px; margin-bottom: 15px; font-weight: bold;">SKILLS</h3>
                                <div style="display: flex; flex-wrap: wrap; gap: 6px;">
                                    ${data.skills.map(s => `<span style="border: 1px solid ${data.color}; padding: 3px 10px; border-radius: 20px; font-size: 11px;">${s}</span>`).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            // --- Layout 3: Minimalist (Clean) ---
            else {
                html = `
                    <div style="padding: 60px; min-height: 297mm; width: 100%; color: #333;">
                        <h1 style="font-size: 32px; font-weight: 300; letter-spacing: 2px; text-transform: uppercase;">${data.name}</h1>
                        <p style="font-size: 12px; letter-spacing: 1px; margin-bottom: 40px;">${data.city} • ${data.phone} • ${data.email}</p>
                        
                        <div style="margin-bottom: 40px;">
                            <h4 style="font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 10px;">OBJECTIVE</h4>
                            <p style="font-size: 13px;">${data.summary}</p>
                        </div>

                        <div style="margin-bottom: 40px;">
                            <h4 style="font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 10px;">WORK EXPERIENCE</h4>
                            <div style="font-size: 13px;">${data.exp.map(e => `<p style="margin-bottom: 8px;">${e}</p>`).join('')}</div>
                        </div>

                        <div style="margin-bottom: 40px;">
                            <h4 style="font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 10px;">EDUCATION</h4>
                            <div style="font-size: 13px;">${data.edu.map(e => `<p style="margin-bottom: 8px;">${e}</p>`).join('')}</div>
                        </div>

                        <div style="display: flex; justify-content: space-between;">
                            <div style="width: 45%;">
                                <h4 style="font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 10px;">SKILLS</h4>
                                <p style="font-size: 13px;">${data.skills.join(', ')}</p>
                            </div>
                            <div style="width: 45%;">
                                <h4 style="font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 10px;">INTERESTS</h4>
                                <p style="font-size: 13px;">${data.hobbies}</p>
                            </div>
                        </div>
                    </div>
                `;
            }

            canvas.innerHTML = html;

            // --- Smart Scaling Logic ---
            const area = document.getElementById('previewArea');
            const scale = (area.offsetWidth - 80) / 794; 
            canvas.style.transform = `scale(${scale < 1 ? scale : 1})`;
        }

        function downloadPDF() {
            const element = document.getElementById('resume-canvas');
            const originalTransform = element.style.transform;
            element.style.transform = "scale(1)"; // PDF साठी स्केल नॉर्मल करा

            const opt = {
                margin: 0,
                filename: 'Professional_Resume.pdf',
                image: { type: 'jpeg', quality: 1 },
                html2canvas: { scale: 3, useCORS: true, letterRendering: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save().then(() => {
                element.style.transform = originalTransform; // पुन्हा मूळ स्केलवर या
            });
        }

        window.onload = update;
        window.onresize = update;
    </script>
</body>
</html>
