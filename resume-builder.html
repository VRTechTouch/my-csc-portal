<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Builder</title>

<style>

body{
font-family: Arial, sans-serif;
background: linear-gradient(135deg,#4facfe,#00f2fe);
margin:0;
padding:0;
}

.container{
width:95%;
max-width:1200px;
margin:auto;
padding:20px;
display:flex;
gap:20px;
}

.form-section{
width:50%;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,0.2);
overflow:auto;
height:90vh;
}

.preview-section{
width:50%;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,0.2);
}

h2{
border-bottom:2px solid #eee;
padding-bottom:5px;
}

input,textarea,select{
width:100%;
padding:8px;
margin:5px 0 10px;
border-radius:5px;
border:1px solid #ccc;
}

button{
background:#4facfe;
color:white;
border:none;
padding:10px 15px;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#2c8ef4;
}

.resume{
padding:20px;
}

.resume img{
width:100px;
height:100px;
border-radius:50%;
object-fit:cover;
}

.resume h1{
margin:0;
}

</style>

</head>
<body>

<div class="container">

<div class="form-section">

<h2>Personal Information</h2>

<input id="name" placeholder="Full Name">
<input id="mobile" placeholder="Mobile Number">
<input id="email" placeholder="Email">
<input id="address" placeholder="Address">
<input type="file" id="photo">

<h2>Career Objective</h2>
<textarea id="objective" rows="3"></textarea>

<h2>Education Details</h2>
<input id="edu1" placeholder="10th Details">
<input id="edu2" placeholder="12th Details">
<input id="edu3" placeholder="Graduation">
<input id="edu4" placeholder="Other Education">

<h2>Experience</h2>
<input id="exp" placeholder="Company Name & Position">

<h2>Skills</h2>
<input id="skills" placeholder="Example: Computer, Typing, Excel">

<h2>Projects / Achievements</h2>
<textarea id="projects"></textarea>

<h2>Template Selection</h2>
<select id="template">
<option value="1">Modern Blue</option>
<option value="2">Minimal Gray</option>
<option value="3">Professional Dark</option>
</select>

<button onclick="generateResume()">Generate Resume</button>
<button onclick="window.print()">Print</button>

</div>

<div class="preview-section">

<h2>Live Preview</h2>

<div id="resumePreview" class="resume">

<img id="previewPhoto">

<h1 id="previewName"></h1>

<p id="previewContact"></p>

<h3>Career Objective</h3>
<p id="previewObjective"></p>

<h3>Education</h3>
<p id="previewEducation"></p>

<h3>Experience</h3>
<p id="previewExp"></p>

<h3>Skills</h3>
<p id="previewSkills"></p>

<h3>Projects & Achievements</h3>
<p id="previewProjects"></p>

</div>

</div>

</div>

<script>

function generateResume(){

document.getElementById("previewName").innerText =
document.getElementById("name").value;

document.getElementById("previewContact").innerText =
document.getElementById("mobile").value + " | " +
document.getElementById("email").value + " | " +
document.getElementById("address").value;

document.getElementById("previewObjective").innerText =
document.getElementById("objective").value;

document.getElementById("previewEducation").innerText =
document.getElementById("edu1").value + "\n" +
document.getElementById("edu2").value + "\n" +
document.getElementById("edu3").value + "\n" +
document.getElementById("edu4").value;

document.getElementById("previewExp").innerText =
document.getElementById("exp").value;

document.getElementById("previewSkills").innerText =
document.getElementById("skills").value;

document.getElementById("previewProjects").innerText =
document.getElementById("projects").value;

let photo=document.getElementById("photo").files[0];

if(photo){

let reader=new FileReader();

reader.onload=function(e){

document.getElementById("previewPhoto").src=e.target.result;

}

reader.readAsDataURL(photo);

}

}

</script>

</body>
</html>
