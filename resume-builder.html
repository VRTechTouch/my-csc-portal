<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Resume Builder | VRTechTouch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&family=Roboto+Mono&display=swap');
        
        body { background-color: #f1f5f9; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .input-group { margin-bottom: 15px; }
        .input-label { block text-xs font-bold text-gray-700 uppercase mb-1; }
        .form-input { w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm; }
        
        /* A4 Fixed Preview Logic */
        .preview-wrapper { 
            background: #525659; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            height: calc(100vh - 80px); 
            overflow-y: auto;
        }
        #resume-preview { 
            background: white; 
            width: 210mm; 
            min-height: 297mm; 
            padding: 15mm; 
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            transform-origin: top center;
        }
        
        /* Layout Specific Styles */
        .layout-creative { border-left: 40px solid var(--primary-color); }
        .layout-classic { font-family: 'Playfair Display', serif; border: 1px solid #eee; }
        .layout-minimalist { padding: 10mm !important; border-top: 10px solid var(--primary-color); }
        .layout-modern { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <header class="bg-white border-b px-6 py-3 flex justify-between items-center shadow-sm z-50">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-bold text-blue-800">VRTech <span class="text-gray-500 font-normal text-sm">Resume Engine</span></h1>
        </div>
        <div class="flex gap-3">
            <select id="layoutSelect" onchange="update()" class="p-2 border rounded-md text-sm font-medium bg-gray-50">
                <option value="executive">Executive Layout</option>
                <option value="creative">Creative Layout</option>
                <option value="classic">Classic Layout</option>
                <option value="modern">Modern Layout</option>
                <option value="minimalist">Minimalist Layout</option>
            </select>
            <input type="color" id="colorPicker" value="#1e40af" oninput="update()" title="Change Theme Color" class="h-10 w-10 p-1 rounded-md border cursor-pointer">
            <button onclick="downloadPDF()" class="bg-blue-600 text-white px-5 py-2 rounded-md hover:bg-blue-700 font-bold text-sm shadow-md transition">Download PDF</button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <aside class="w-1/3 bg-white border-r overflow-y-auto p-6 shadow-xl z-40">
            
            <section class="mb-8">
                <h3 class="text-blue-600 font-bold border-b pb-2 mb-4">Personal Info</h3>
                <div class="input-group">
                    <label class="input-label">नाव</label>
                    <input type="text" id="inName" oninput="update()" placeholder="Full Name" class="form-input">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="input-group">
                        <label class="input-label">ईमेल</label>
                        <input type="email" id="inEmail" oninput="update()" class="form-input">
                    </div>
                    <div class="input-group">
                        <label class="input-label">मोबाईल</label>
                        <input type="text" id="inPhone" oninput="update()" class="form-input">
                    </div>
                    <div class="input-group">
                        <label class="input-label">जन्म तारीख (DOB)</label>
                        <input type="date" id="inDOB" oninput="update()" class="form-input">
                    </div>
                    <div class="input-group">
                        <label class="input-label">पत्ता</label>
                        <input type="text" id="inAddress" oninput="update()" class="form-input">
                    </div>
                </div>
            </section>

            <section class="mb-8">
                <h3 class="text-blue-600 font-bold border-b pb-2 mb-4">Content Sections</h3>
                <div class="input-group">
                    <label class="input-label">Professional Summary</label>
                    <textarea id="inSummary" oninput="update()" rows="3" class="form-input"></textarea>
                </div>
                <div class="input-group">
                    <label class="input-label">Experience (कामाचा अनुभव)</label>
                    <textarea id="inExp" oninput="update()" rows="4" placeholder="उदा. 2022-Present: Senior Operator at CSC" class="form-input"></textarea>
                </div>
                <div class="input-group">
                    <label class="input-label">Education (शिक्षण)</label>
                    <textarea id="inEdu" oninput="update()" rows="4" placeholder="उदा. B.Com - Amravati University (2021)" class="form-input"></textarea>
                </div>
                <div class="input-group">
                    <label class="input-label">Skills (स्वल्पविराम द्या)</label>
                    <input type="text" id="inSkills" oninput="update()" class="form-input">
                </div>
                <div class="input-group">
                    <label class="input-label">Hobbies & Interests</label>
                    <input type="text" id="inHobbies" oninput="update()" placeholder="उदा. Reading, Cricket, Coding" class="form-input">
                </div>
            </section>
        </aside>

        <main class="flex-1 preview-wrapper" id="preview-wrapper">
            <div id="resume-preview">
                </div>
        </main>
    </div>

    <script>
        function update() {
            const data = {
                name: document.getElementById('inName').value || "Your Full Name",
                email: document.getElementById('inEmail').value || "email@example.com",
                phone: document.getElementById('inPhone').value || "+91 0000000000",
                dob: document.getElementById('inDOB').value || "",
                address: document.getElementById('inAddress').value || "Your Address",
                summary: document.getElementById('inSummary').value || "A brief summary about yourself...",
                skills: document.getElementById('inSkills').value.split(','),
                hobbies: document.getElementById('inHobbies').value || "Not specified",
                exp: document.getElementById('inExp').value,
                edu: document.getElementById('inEdu').value,
                color: document.getElementById('colorPicker').value,
                layout: document.getElementById('layoutSelect').value
            };

            const preview = document.getElementById('resume-preview');
            preview.style.setProperty('--primary-color', data.color);
            
            // Layout Logic
            let html = "";

            if (data.layout === 'executive' || data.layout === 'minimalist' || data.layout === 'creative' || data.layout === 'classic') {
                html = `
                    <div class="layout-${data.layout}">
                        <div style="border-bottom: 2px solid ${data.color}; padding-bottom: 15px; margin-bottom: 20px;">
                            <h1 style="color: ${data.color}; font-size: 32px; font-weight: 800; text-transform: uppercase;">${data.name}</h1>
                            <div style="font-size: 12px; color: #666; display: flex; gap: 15px; margin-top: 5px;">
                                <span>📧 ${data.email}</span> <span>📞 ${data.phone}</span> <span>📍 ${data.address}</span>
                                ${data.dob ? `<span>🎂 DOB: ${data.dob}</span>` : ''}
                            </div>
                        </div>

                        <div style="margin-bottom: 20px;">
                            <h3 style="color: ${data.color}; font-weight: bold; text-transform: uppercase; border-bottom: 1px solid #eee; margin-bottom: 5px;">Summary</h3>
                            <p style="font-size: 13px; line-height: 1.6;">${data.summary}</p>
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
                            <div>
                                <h3 style="color: ${data.color}; font-weight: bold; text-transform: uppercase; border-bottom: 1px solid #eee; margin-bottom: 10px;">Experience</h3>
                                <p style="font-size: 13px; white-space: pre-line;">${data.exp || "Add your work details..."}</p>
                            </div>
                            <div>
                                <h3 style="color: ${data.color}; font-weight: bold; text-transform: uppercase; border-bottom: 1px solid #eee; margin-bottom: 10px;">Education</h3>
                                <p style="font-size: 13px; white-space: pre-line;">${data.edu || "Add your education details..."}</p>
                            </div>
                        </div>

                        <div style="margin-top: 25px;">
                            <h3 style="color: ${data.color}; font-weight: bold; text-transform: uppercase; border-bottom: 1px solid #eee; margin-bottom: 10px;">Skills</h3>
                            <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                                ${data.skills.map(s => s.trim() ? `<span style="background: #f0f0f0; padding: 4px 10px; border-radius: 4px; font-size: 11px;">${s.trim()}</span>` : '').join('')}
                            </div>
                        </div>

                        <div style="margin-top: 25px;">
                            <h3 style="color: ${data.color}; font-weight: bold; text-transform: uppercase; border-bottom: 1px solid #eee; margin-bottom: 10px;">Hobbies & Interests</h3>
                            <p style="font-size: 13px;">${data.hobbies}</p>
                        </div>
                    </div>
                `;
            } else if (data.layout === 'modern') {
                html = `
                    <div class="layout-modern">
                        <div style="background: ${data.color}; color: white; padding: 20px; border-radius: 10px;">
                            <h1 style="font-size: 24px; font-weight: 800; margin-bottom: 20px;">${data.name}</h1>
                            <p style="font-size: 11px; margin-bottom: 5px;">${data.email}</p>
                            <p style="font-size: 11px; margin-bottom: 5px;">${data.phone}</p>
                            <p style="font-size: 11px; margin-bottom: 20px;">${data.address}</p>
                            
                            <h4 style="border-bottom: 1px solid white; margin-top: 20px; font-weight: bold; font-size: 12px; text-transform: uppercase;">Skills</h4>
                            <div style="font-size: 11px; margin-top: 10px;">${data.skills.join(', ')}</div>

                            <h4 style="border-bottom: 1px solid white; margin-top: 20px; font-weight: bold; font-size: 12px; text-transform: uppercase;">Hobbies</h4>
                            <div style="font-size: 11px; margin-top: 10px;">${data.hobbies}</div>
                        </div>
                        <div>
                            <h2 style="color: ${data.color}; font-weight: bold; text-transform: uppercase;">Profile Summary</h2>
                            <p style="font-size: 13px; margin-bottom: 20px;">${data.summary}</p>
                            
                            <h2 style="color: ${data.color}; font-weight: bold; text-transform: uppercase;">Experience</h2>
                            <p style="font-size: 13px; white-space: pre-line; margin-bottom: 20px;">${data.exp}</p>

                            <h2 style="color: ${data.color}; font-weight: bold; text-transform: uppercase;">Education</h2>
                            <p style="font-size: 13px; white-space: pre-line;">${data.edu}</p>
                        </div>
                    </div>
                `;
            }

            preview.innerHTML = html;
            
            // Fixed scaling for Preview to fit screen
            const wrapper = document.getElementById('preview-wrapper');
            const scale = (wrapper.offsetWidth - 40) / 794; // 794 is 210mm in pixels at 96dpi
            if (scale < 1) {
                preview.style.transform = `scale(${scale})`;
            } else {
                preview.style.transform = `scale(1)`;
            }
        }

        function downloadPDF() {
            const element = document.getElementById('resume-preview');
            // Remove scale before download for HD quality
            const oldTransform = element.style.transform;
            element.style.transform = 'scale(1)';
            
            const opt = {
                margin: 0,
                filename: 'My_Professional_Resume.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 3, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).toPdf().get('pdf').then(function (pdf) {
                element.style.transform = oldTransform; // restore preview scale
            }).save();
        }

        // Initial update
        window.onload = update;
        window.onresize = update;
    </script>
</body>
</html>
