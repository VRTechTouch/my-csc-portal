<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stylish QR Generator | My CSC Portal</title>
    <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 450px; width: 100%; }
        h2 { text-align: center; color: #1a73e8; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .row { display: flex; gap: 10px; }
        .row div { flex: 1; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; font-size: 16px; }
        .btn-generate { background-color: #1a73e8; color: white; }
        .btn-download { background-color: #34a853; color: white; display: none; }
        #qr-result { margin-top: 25px; display: flex; justify-content: center; border: 1px dashed #ccc; padding: 10px; border-radius: 10px; min-height: 250px; align-items: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎨 QR Designer</h2>
    
    <div class="form-group">
        <label>URL किंवा मजकूर:</label>
        <input type="text" id="qr-input" placeholder="येथे लिंक टाका...">
    </div>

    <div class="row">
        <div class="form-group">
            <label>Dots Style (ठिपके):</label>
            <select id="dots-style">
                <option value="square">Square</option>
                <option value="dots" selected>Dots (गोल)</option>
                <option value="rounded">Rounded</option>
                <option value="extra-rounded">Extra Rounded</option>
                <option value="classy">Classy (स्टाइलिश)</option>
                <option value="classy-rounded">Classy Rounded</option>
            </select>
        </div>
        <div class="form-group">
            <label>Corner Style:</label>
            <select id="corner-style">
                <option value="square">Square</option>
                <option value="dot" selected>Rounded</option>
                <option value="extra-rounded">Extra Rounded</option>
            </select>
        </div>
    </div>

    <div class="row">
        <div class="form-group">
            <label>QR रंग:</label>
            <input type="color" id="qr-color" value="#1a73e8">
        </div>
        <div class="form-group">
            <label>लोगो (Optional):</label>
            <input type="file" id="qr-logo" accept="image/*">
        </div>
    </div>

    <button class="btn-generate" onclick="createQR()">Generate QR Code</button>
    
    <div id="qr-result">
        <p style="color: #888;">QR कोड इथे जनरेट होईल</p>
    </div>

    <button id="dl-btn" class="btn-download" onclick="downloadNow()">Download PNG</button>
</div>

<script>
    let finalQR;

    function createQR() {
        const inputData = document.getElementById("qr-input").value;
        const dotType = document.getElementById("dots-style").value;
        const cornerType = document.getElementById("corner-style").value;
        const colorValue = document.getElementById("qr-color").value;
        const logoInput = document.getElementById("qr-logo").files[0];

        if (!inputData) {
            alert("कृपया माहिती भरा!");
            return;
        }

        const config = {
            width: 280,
            height: 280,
            data: inputData,
            dotsOptions: { color: colorValue, type: dotType },
            cornersSquareOptions: { color: colorValue, type: cornerType },
            backgroundOptions: { color: "#ffffff" },
            imageOptions: { crossOrigin: "anonymous", margin: 5 }
        };

        if (logoInput) {
            const reader = new FileReader();
            reader.onload = function(e) {
                config.image = e.target.result;
                render(config);
            };
            reader.readAsDataURL(logoInput);
        } else {
            render(config);
        }
    }

    function render(config) {
        document.getElementById("qr-result").innerHTML = "";
        finalQR = new QRCodeStyling(config);
        finalQR.append(document.getElementById("qr-result"));
        document.getElementById("dl-btn").style.display = "block";
    }

    function downloadNow() {
        if (finalQR) {
            finalQR.download({ name: "my-csc-qr", extension: "png" });
        }
    }
</script>

</body>
</html>
