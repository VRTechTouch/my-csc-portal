<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern QR Designer | My CSC Portal</title>
    <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 450px;
            width: 100%;
        }

        h2 { text-align: center; color: #111827; margin-bottom: 25px; }

        .label-text {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #4b5563;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .input-box {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            margin-bottom: 20px;
            box-sizing: border-box;
            font-size: 14px;
        }

        /* Modern Color Picker Button */
        .color-picker-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            border: 2px solid #6366f1; /* ठळक बॉर्डर जेणेकरून बटन उठून दिसेल */
            border-radius: 12px;
            padding: 10px 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 20px;
        }

        .color-picker-btn:hover {
            background: #f5f3ff;
            transform: scale(1.02);
        }

        .color-info { display: flex; align-items: center; }

        .color-preview {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 0 0 1px #e5e7eb;
            margin-right: 12px;
        }

        .color-label { font-size: 14px; font-weight: 600; color: #1f2937; }

        #qr-color {
            opacity: 0;
            position: absolute;
            width: 0; height: 0;
        }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .btn-gen {
            width: 100%;
            background: #6366f1;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 16px;
        }

        #qr-display {
            margin-top: 25px;
            background: #f9fafb;
            border: 2px dashed #d1d5db;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            padding: 20px;
            min-height: 250px;
            align-items: center;
        }

        .btn-down {
            display: none;
            width: 100%;
            background: #10b981;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 12px;
            margin-top: 15px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>✨ QR Designer</h2>

    <label class="label-text">Content / URL</label>
    <input type="text" id="qr-data" class="input-box" placeholder="उदा. https://google.com">

    <div class="grid">
        <div>
            <label class="label-text">QR Style</label>
            <select id="dot-style" class="input-box">
                <option value="square">Square</option>
                <option value="dots" selected>Dots (Modern)</option>
                <option value="classy">Classy</option>
                <option value="rounded">Rounded</option>
            </select>
        </div>
        <div>
            <label class="label-text">Corners</label>
            <select id="corner-style" class="input-box">
                <option value="square">Square</option>
                <option value="dot" selected>Rounded</option>
            </select>
        </div>
    </div>

    <label class="label-text">QR Color</label>
    <div class="color-picker-btn" onclick="document.getElementById('qr-color').click()">
        <div class="color-info">
            <div id="preview-circ" class="color-preview" style="background: #6366f1;"></div>
            <span class="color-label">रंग निवडा (Select Color)</span>
        </div>
        <span id="hex-text" style="font-size: 12px; color: #6b7280; font-weight: bold;">#6366F1</span>
        <input type="color" id="qr-color" value="#6366f1" oninput="updateUI(this.value)">
    </div>

    <button class="btn-gen" onclick="generate()">Generate QR Code</button>

    <div id="qr-display">
        <span style="color: #9ca3af;">तुमचा QR इथे दिसेल</span>
    </div>

    <button id="dl-btn" class="btn-down" onclick="download()">Download PNG</button>
</div>

<script>
    let qr;

    function updateUI(color) {
        document.getElementById('preview-circ').style.background = color;
        document.getElementById('hex-text').innerText = color.toUpperCase();
    }

    function generate() {
        const data = document.getElementById('qr-data').value;
        const color = document.getElementById('qr-color').value;
        const dot = document.getElementById('dot-style').value;
        const corner = document.getElementById('corner-style').value;

        if(!data) { alert("कृपया लिंक टाका!"); return; }

        document.getElementById('qr-display').innerHTML = "";
        qr = new QRCodeStyling({
            width: 250,
            height: 250,
            data: data,
            dotsOptions: { color: color, type: dot },
            cornersSquareOptions: { color: color, type: corner },
            backgroundOptions: { color: "#ffffff" }
        });

        qr.append(document.getElementById('qr-display'));
        document.getElementById('dl-btn').style.display = "block";
    }

    function download() {
        if(qr) qr.download({ name: "qr", extension: "png" });
    }
</script>

</body>
</html>
