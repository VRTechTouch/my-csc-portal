<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSC Marketing Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div id="setup-section" class="max-w-md mx-auto mt-10 p-6 bg-white rounded-lg shadow-xl">
        <h2 class="text-2xl font-bold text-blue-600 mb-4 text-center">CSC Center Setup</h2>
        <p class="text-gray-600 mb-6 text-sm">Tumchi mahiti bhara ani marketing link banva.</p>
        
        <div class="space-y-4">
            <input type="text" id="cscName" placeholder="CSC Center che Nav" class="w-full p-2 border rounded">
            <input type="text" id="ownerName" placeholder="Tumche Nav" class="w-full p-2 border rounded">
            <input type="text" id="phone" placeholder="WhatsApp Number" class="w-full p-2 border rounded">
            <textarea id="services" placeholder="Services (e.g. Aadhar, PAN, Recharge)" class="w-full p-2 border rounded"></textarea>
            
            <button onclick="generateLink()" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">
                Marketing Link Banva
            </button>
        </div>

        <div id="result" class="mt-6 hidden">
            <p class="text-green-600 font-bold text-sm">Tumchi Link Taiyar Ahe:</p>
            <input type="text" id="finalLink" class="w-full p-2 border mt-2 text-xs bg-gray-50" readonly>
            <button onclick="copyLink()" class="mt-2 w-full bg-green-500 text-white py-1 rounded text-sm">Link Copy Kara</button>
        </div>
    </div>

    <div id="customer-view" class="max-w-md mx-auto mt-10 p-6 bg-white rounded-lg shadow-xl hidden">
        <div class="text-center">
            <h1 id="view-cscName" class="text-3xl font-extrabold text-blue-800"></h1>
            <p class="text-gray-500 mt-1">Sanchalak: <span id="view-ownerName"></span></p>
            <hr class="my-4">
            <div class="bg-blue-50 p-4 rounded-lg">
                <h3 class="font-bold text-blue-700 mb-2 underline">Amchyakade Hya Suvidha Miltil:</h3>
                <p id="view-services" class="text-gray-700 leading-relaxed"></p>
            </div>
            <a id="view-whatsapp" href="#" class="mt-6 inline-block bg-green-500 text-white px-6 py-3 rounded-full font-bold shadow-lg">
                WhatsApp Var Sampark Kara
            </a>
        </div>
    </div>

    <script>
        // 1. Link Generate Karnyachi Logic
        function generateLink() {
            const name = encodeURIComponent(document.getElementById('cscName').value);
            const owner = encodeURIComponent(document.getElementById('ownerName').value);
            const phone = encodeURIComponent(document.getElementById('phone').value);
            const svcs = encodeURIComponent(document.getElementById('services').value);
            
            const baseUrl = window.location.href.split('?')[0];
            const finalUrl = `${baseUrl}?name=${name}&owner=${owner}&phone=${phone}&services=${svcs}`;
            
            document.getElementById('finalLink').value = finalUrl;
            document.getElementById('result').classList.remove('hidden');
        }

        // 2. Link Copy Karne
        function copyLink() {
            const copyText = document.getElementById("finalLink");
            copyText.select();
            document.execCommand("copy");
            alert("Link Copy Zali! Atah hi WhatsApp var share kara.");
        }

        // 3. URL Madhun Data vachun Customer la dakhvne
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            if(params.has('name')) {
                document.getElementById('setup-section').classList.add('hidden');
                document.getElementById('customer-view').classList.remove('hidden');
                
                document.getElementById('view-cscName').innerText = params.get('name');
                document.getElementById('view-ownerName').innerText = params.get('owner');
                document.getElementById('view-services').innerText = params.get('services');
                document.getElementById('view-whatsapp').href = "https://wa.me/91" + params.get('phone');
            }
        }
    </script>
</body>
</html>
